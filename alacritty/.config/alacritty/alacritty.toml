[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"

[window]
dynamic_padding = true
decorations = "none"
opacity = 1
decorations_theme_variant = "Dark"

[window.dimensions]
columns = 100
lines = 30

[window.class]
instance = "Alacritty"
general = "Alacritty"

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
foreground = "#bbc3d4"
background = "#242933"

[colors.cursor]
text = "#191d24"
cursor = "#bbc3d4"

[colors.selection]
text = "#bbc3d4"
background = "#1b1f26"

[colors.normal]
black = "#191d24"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#5e81ac"
magenta = "#b48ead"
cyan = "#8fbcbb"
white = "#bbc3d4"

[colors.bright]
black = "#3b4252"
red = "#c5727a"
green = "#b1c89d"
yellow = "#efd49f"
blue = "#88c0d0"
magenta = "#be9d88"
cyan = "#9fc6c5"
white = "#d8dee9"

[font]
size = 12

[font.normal]
family = "CommitMono Nerd Font"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = "Underline"
vi_mode_style = "None"
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

[general]
live_config_reload = true
working_directory = "None"
