<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Generic family aliases: riced defaults for apps that request
     sans-serif / serif / monospace (browsers, Qt, random GTK apps).
     User config loads at 50-user.conf (BEFORE system 60-latin.conf), so
     plain <prefer> aliases get overwritten by Noto's own generic rules.
     Strong-binding <match> edits survive that — see:
     https://wiki.archlinux.org/title/Font_configuration -->
<fontconfig>
  <!-- sans-serif -> Adwaita Sans -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Adwaita Sans</string>
    </edit>
  </match>

  <!-- serif -> Source Serif 4 -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Serif 4</string>
    </edit>
  </match>

  <!-- monospace -> Monaspace Neon Frozen -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Monaspace Neon Frozen</string>
    </edit>
  </match>

  <!-- Emoji fallback: everything proportional falls back to Noto Color Emoji -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
