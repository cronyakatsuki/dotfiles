<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Generic family aliases: riced defaults for apps that request
     sans-serif / serif / monospace (browsers, Qt, random GTK apps). -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Source Serif 4</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Monaspace Neon Frozen</family>
    </prefer>
  </alias>

  <!-- Emoji fallback so emoji render even in secondary positions of font stacks -->
  <alias>
    <family>Adwaita Sans</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
