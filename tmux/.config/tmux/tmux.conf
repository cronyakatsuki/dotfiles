# ================================================
# TMUX CONFIG — Core Settings
# ================================================

# ---- Terminal & Display ----
set-option -sa terminal-overrides ",alacritty:Tc"
set -g default-terminal "tmux-256color"

# ---- Behavior ----
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g escape-time 0
set-option -g status-interval 5
set -g extended-keys on
set -g extended-keys-format csi-u
set -g detach-on-destroy off
set -g status-position top
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g history-limit 50000
set -g set-titles on
set -g monitor-activity on

# ---- Prefix: Ctrl+Space ----
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- Keybindings ----
bind -n M-K previous-window
bind -n M-J next-window

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind "'" split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key x kill-pane
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded!"

# ---- Sesh (session manager) ----
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key "K" display-popup -h 90% -w 50% -E "sesh picker -i"
bind -N "last-session (via sesh) " L run-shell "sesh last"

# ---- Pane border ----
setw -g pane-border-status top
setw -g pane-border-format '─'

# ================================================
# THEME — Catppuccin Mocha (Nordic-style)
# ================================================
source-file ~/.config/tmux/theme.conf

# ================================================
# TPM PLUGINS
# ================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# NOTE 2026-09-23: tmux-continuum REMOVED — its scheduler runs a #() script
# in status-right every status-interval (was 1s) and fires a full resurrect
# save every 15min, stalling the single-threaded tmux server (input lag /
# slow splits). Auto-save now handled by a systemd user timer:
#   systemctl --user list-timers tmux-autosave.timer
# Manual save/restore still works: prefix+S / prefix+R

run '~/.local/share/tmux/plugins/tpm/tpm'
