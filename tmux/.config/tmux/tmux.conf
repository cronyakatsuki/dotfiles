# ================================================
# TMUX CONFIG — Core Settings
# ================================================

# ---- Terminal & Display ----
set-option -sa terminal-overrides ",alacritty:Tc"
set -g default-terminal "tmux-256color"

# run-shell/display-popup children inherit the SERVER env, not the invoking
# shell's. When the server is started detached (uwsm/systemd) it has no TERM,
# COLORTERM or FZF_DEFAULT_OPTS — fzf then renders monochrome and tmux 3.8's
# default popup-style (bg=themedarkgrey) shows through as a gray popup.
set-environment -g TERM tmux-256color
set-environment -g COLORTERM truecolor
set-environment -g FZF_DEFAULT_OPTS_FILE ~/.config/fzf/default-opts

# ---- Behavior ----
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g escape-time 0
set-option -g status-interval 5
set -g extended-keys on
set -g extended-keys-format csi-u
set -g detach-on-destroy off
set -g status-position top
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g history-limit 50000
set -g set-titles on
set -g monitor-activity on

# ---- Prefix: Ctrl+Space ----
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- Keybindings ----
bind -n M-K previous-window
bind -n M-J next-window

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind "'" split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key x kill-pane
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded!"

# ---- Sesh (session manager) ----
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key "K" display-popup -h 90% -w 50% -E "sesh picker -i"
bind -N "last-session (via sesh) " L run-shell "sesh last"

# ---- Pane border ----
setw -g pane-border-status top
setw -g pane-border-format '─'

# ================================================
# THEME — Catppuccin Mocha (Nordic-style)
# ================================================
source-file ~/.config/tmux/theme.conf

# ================================================
# TPM PLUGINS
# ================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'
# NOTE 2026-10-21: tmux-resurrect REMOVED (user never used session save/restore,
# and the tmux-autosave timer that fed it was NixOS-era, gone with the wipe).
# If ever missed: re-add '@plugin tmux-plugins/tmux-resurrect' + prefix+S/R.

run '~/.local/share/tmux/plugins/tpm/tpm'

# 2026-10-23: don't freeze HYPRLAND_INSTANCE_SIGNATURE into the tmux server's env.
# uwsm stop/start cycles recreate Hyprland's socket dir (new signature), and any
# process started before the restart (tmux server, ghostty daemon) would keep
# the stale value → hyprctl "Couldn't connect to .../.socket.sock". New panes now
# inherit the fresh signature from the shell that spawns them.
set -gu update-environment
set -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR SSH_AUTH_SOCK HYPRLAND_INSTANCE_SIGNATURE"
