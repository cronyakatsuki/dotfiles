# ================================================
# THEME: Catppuccin Mocha — Nordic-style layout
# ================================================

# ── Palette ──
# Backgrounds
set -g @ctp_crust      '#11111b'
set -g @ctp_mantle     '#181825'
set -g @ctp_surface0   '#313244'
set -g @ctp_surface1   '#45475a'
set -g @ctp_surface2   '#585b70'

# Foregrounds
set -g @ctp_text       '#cdd6f4'
set -g @ctp_subtext1   '#a6adc8'
set -g @ctp_subtext0   '#bac2de'
set -g @ctp_overlay2   '#9399b2'
set -g @ctp_overlay1   '#7f849c'
set -g @ctp_overlay0   '#6c7086'

# Accents
set -g @ctp_red        '#f38ba8'
set -g @ctp_peach      '#fab387'
set -g @ctp_yellow     '#f9e2af'
set -g @ctp_green      '#a6e3a1'
set -g @ctp_teal       '#94e2d5'
set -g @ctp_sky        '#89dceb'
set -g @ctp_sapphire   '#74c7ec'
set -g @ctp_blue       '#89b4fa'
set -g @ctp_lavender   '#b4befe'
set -g @ctp_mauve      '#cba6f7'
set -g @ctp_flamingo   '#f2cdcd'
set -g @ctp_rosewater  '#f5e0dc'

# ── Status bar background ──
set -g status-style "bg=#{@ctp_mantle},fg=#{@ctp_text}"

# ── Left: Session · User ──
set -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@ctp_mantle},bg=#{@ctp_sapphire},bold] #S #[fg=#{@ctp_sapphire},bg=#{@ctp_surface1},nobold]#[fg=#{@ctp_green},bg=#{@ctp_surface1},bold] #U #[fg=#{@ctp_surface1},bg=#{@ctp_mantle},nobold]'

# ── Right: Date · Time · Host ──
set -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@ctp_surface1}]#[fg=#{@ctp_text},bg=#{@ctp_surface1}] %Y-%m-%d  %T #[fg=#{@ctp_yellow},bg=#{@ctp_surface1},bold]#[fg=#{@ctp_mantle},bg=#{@ctp_yellow},bold] #h '

# ── Window separator ──
set -g window-status-separator " "

# ── Inactive window ──
set -g window-status-format '#[fg=#{@ctp_overlay2},bg=#{@ctp_mantle}] #I  #[fg=#{@ctp_overlay2},bg=#{@ctp_mantle}]#W '

# ── Active window ──
set -g window-status-current-format '#[fg=#{@ctp_mantle},bg=#{@ctp_surface0}]#[fg=#{@ctp_yellow},bg=#{@ctp_surface0}] #I  #[fg=#{@ctp_yellow},bg=#{@ctp_surface0},bold]#W #[fg=#{@ctp_surface0},bg=#{@ctp_mantle},nobold]'

# ── Window styles ──
set-window-option -g window-status-style "fg=#{@ctp_overlay2},bg=#{@ctp_mantle}"
set-window-option -g window-status-current-style "fg=#{@ctp_text},bg=#{@ctp_surface0}"
set-window-option -g window-status-activity-style "bg=#{@ctp_surface0},fg=#{@ctp_surface2}"
set-window-option -g window-status-bell-style "fg=#{@ctp_mantle},bg=#{@ctp_red}"

# ── Pane borders ──
# (raw hex — these aren't format strings so #{} won't expand)
set-option -g pane-border-style "fg=#45475a"
set-option -g pane-active-border-style "fg=#74c7ec"
set-option -g display-panes-active-colour "#74c7ec"
set-option -g display-panes-colour "#fab387"

# ── Mode & Messages ──
set-option -g mode-style "fg=#cba6f7,bg=#313244"
set-option -g message-style "fg=#f38ba8,bg=#181825"
set-option -g message-command-style "fg=#585b70,bg=#313244"

# ── Clock ──
set-window-option -g clock-mode-colour "#74c7ec"
