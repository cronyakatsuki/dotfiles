version: 7
daemon:
  log_level: info
  admin_group: wheel
  disable_clocks_cleanup: false
apply_settings_timer: 5
gpus:
  10DE:2D04-1771:205E-0000:01:00.0:
    fan_control_enabled: true
    fan_control_settings:
      mode: curve
      static_speed: 0.5
      temperature_key: edge
      interval_ms: 500
      curve:
        30: 0.3
        40: 0.4
        50: 0.6
        55: 0.8
        60: 1.0
      spindown_delay_ms: 5000
      change_threshold: 2
    power_cap: 150.0
    min_core_clock: 180
    max_core_clock: 2950
    gpu_clock_offsets:
      0: 500
    mem_clock_offsets:
      0: 0
current_profile: null
auto_switch_profiles: false
