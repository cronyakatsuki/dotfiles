[General]
ConfigVersion=2

[Browser]
CustomProxyLocation=
Enabled=true

[FdoSecrets]
ConfirmAccessItem=false
Enabled=true

[GUI]
ApplicationTheme=classic
HidePasswords=false
MinimizeOnClose=true
MinimizeOnStartup=true
ShowTrayIcon=true
TrayIconAppearance=monochrome-light

[KeeShare]
Active="<?xml version=\"1.0\"?><KeeShare><Active/></KeeShare>\n"
Own="<?xml version=\"1.0\"?><KeeShare><PrivateKey></PrivateKey><PublicKey><Signer>crony</Signer><Key></Key></PublicKey></KeeShare>\n"
QuietSuccess=true

[PasswordGenerator]
AdditionalChars=
AdvancedMode=true
Braces=true
Dashes=true
EASCII=false
ExcludedChars=
Length=72
Logograms=true
Math=true
Punctuation=true
Quotes=true

[Security]
LockDatabaseIdle=false
