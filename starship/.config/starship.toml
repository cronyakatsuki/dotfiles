"$schema" = 'https://starship.rs/config-schema.json'

format = '''
$username$directory$git_branch$git_status$time
$character'''

palette = 'catppuccin_mocha'

[username]
show_always = true
style_user = "fg:peach"
style_root = "fg:red"
format = '[\[$user\]](fg:peach) '

[directory]
style = "fg:yellow"
format = '[\[ $path\]](fg:yellow) '
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"

[git_branch]
symbol = ""
style = "fg:green"
format = '[\[$symbol $branch\]](fg:green) '

[git_status]
style = "fg:green"
format = '[\[$all_status$ahead_behind\]](fg:green) '

[time]
disabled = false
time_format = "%R"
style = "fg:lavender"
format = '[\[ $time\]](fg:lavender) '

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
