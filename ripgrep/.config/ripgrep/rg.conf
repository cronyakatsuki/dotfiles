# ~/.config/ripgrep/rg.conf — default flags for every rg invocation.
# Loaded via RIPGREP_CONFIG_PATH, exported in 00-env.zsh.
# Format: every line is ONE argument; a flag's value goes on the NEXT line.
# See "CONFIGURATION FILES" in `man rg`.
# Override per-call by passing the same flag explicitly (later wins).

# Case-insensitive unless the pattern contains uppercase
--smart-case

# Include hidden files and directories
--hidden

# ...but never descend into junk dirs (mirrors ~/.config/fd/ignore)
--glob
!**/.git/**
--glob
!**/.cache/**
--glob
!**/node_modules/**
--glob
!**/target/**