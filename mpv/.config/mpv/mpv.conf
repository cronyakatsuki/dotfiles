# ===== mpv.conf — HDR on Wayland + NVIDIA =====
# REQUIRED: vo=gpu-next (NOT dmabuf-wayland, which doesn't work on NVIDIA)

# --- Renderer ---
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=nvdec

# --- HDR output policy ---
target-colorspace-hint=no

# --- Scaling (quality-first) ---
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
scale-antiring=0.6
cscale-antiring=0.6

# --- Dithering ---
dither-depth=10
dither=error-diffusion
error-diffusion=sierra-lite

# --- Debanding ---
deband=yes

# --- Audio ---
ao=pipewire

# --- Sync ---
video-sync=audio

# ===== uosc integration =====
osc=no            # <--- THIS is the critical line you're missing
osd-bar=no        # uosc provides its own seeking & volume indicators
border=no         # uosc draws its own window controls and border

# ===== HDR profile (PQ/HLG sources) =====
[HDR]
profile-desc=Enable HDR output for PQ or HLG sources
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy

target-colorspace-hint=yes
target-trc=pq
target-prim=bt.2020
target-gamut=dci-p3
target-peak=400
target-contrast=1000000

gamut-mapping-mode=perceptual
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
hdr-compute-peak=yes

# ===== HDR10+ (prefer metadata when present) =====
[auto-hdr10plus]
profile-desc=Prefer HDR10+ metadata when present
profile-cond=(get("video-params/scene-max-r", 0) > 0) or (get("video-params/scene-max-g", 0) > 0) or (get("video-params/scene-max-b", 0) > 0)
profile-restore=copy
tone-mapping=st2094-40
hdr-compute-peak=no

# ===== Dolby Vision profiles 5/8/9 =====
[auto-dolby-vision-rpu]
profile-desc=Prefer Dolby Vision metadata for profiles 5, 8, 9
profile-cond=(get("current-tracks/video/dolby-vision-profile", 0) == 5) or (get("current-tracks/video/dolby-vision-profile", 0) == 8) or (get("current-tracks/video/dolby-vision-profile", 0) == 9)
profile-restore=copy
hdr-compute-peak=no
