# ===== uosc UI controls =====
tab        script-binding uosc/toggle-ui        # toggle UI visibility
mbtn_right script-binding uosc/menu             # right-click context menu
menu       script-binding uosc/menu             # keyboard Menu key

# ===== uosc menus (open via key) =====
# Each opens a uosc menu for that function
O          script-binding uosc/show-infile       # open file browser
S          script-binding uosc/subtitles         # subtitle menu (also download from OpenSubtitles)
A          script-binding uosc/audio             # audio track menu
V          script-binding uosc/video             # video track menu
P          script-binding uosc/playlist          # playlist menu
C          script-binding uosc/chapters          # chapter menu
E          script-binding uosc/editions          # editions (for multi-edition files)
T          script-binding uosc/toggle-ontop      # toggle always-on-top

# ===== uosc elements =====
# Mouse interactions are handled automatically by uosc (hover near bottom for controls,
# hover near right for volume, etc.)

# ===== Standard mpv controls (kept for convenience) =====
SPACE      cycle pause
>          add speed  0.1                       # speed up
<          add speed -0.1                       # slow down
BS         set speed 1.0                        # reset speed
q          quit
W          quit-watch-later
f          cycle fullscreen
s          screenshot

# ===== Seeking =====
RIGHT      seek  5
LEFT       seek -5
UP         seek  60
DOWN       seek -60
Shift+RIGHT seek  1 exact
Shift+LEFT  seek -1 exact

# ===== Audio/Volume (uosc draws the volume indicator) =====
m          cycle mute
/          add volume -2
*          add volume  2

# ===== Subtitle toggle =====
v          cycle sub-visibility

# ===== Stats overlay (from earlier setup) =====
i          script-binding stats/display-stats
1          script-binding stats/display-stats-1
2          script-binding stats/display-stats-2
3          script-binding stats/display-stats-3

# ===== Quality menu (uosc-compatible version) =====
F          script-binding quality_menu/video_formats_toggle
Alt+f      script-binding quality_menu/audio_formats_toggle
Ctrl+f     script-binding quality_menu/menu_keybind
